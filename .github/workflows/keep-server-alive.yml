name: Keep server active

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-server-active
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
    steps:
      - name: Send health check
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$HEALTHCHECK_URL" ]]; then
            echo "::error::Set the repository Actions variable HEALTHCHECK_URL to the deployed app URL ending in /api/health."
            exit 1
          fi

          case "$HEALTHCHECK_URL" in
            https://*) ;;
            *)
              echo "::error::HEALTHCHECK_URL must use HTTPS."
              exit 1
              ;;
          esac

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          set +e
          http_status="$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --location \
            --max-redirs 3 \
            --connect-timeout 10 \
            --max-time 20 \
            --retry 2 \
            --retry-delay 2 \
            --retry-all-errors \
            --output "$response_file" \
            --write-out '%{http_code}' \
            "$HEALTHCHECK_URL")"
          curl_status=$?
          set -e

          if [[ "$curl_status" -eq 0 && "$http_status" =~ ^2[0-9]{2}$ ]]; then
            printf 'Health check succeeded (HTTP %s)\n' "$http_status"
            cat "$response_file"
          else
            echo "::error::Health check failed (curl exit ${curl_status}, HTTP ${http_status:-unavailable})."
            if [[ -s "$response_file" ]]; then
              cat "$response_file"
            fi
            exit 1
          fi
