# Configuration for Firebase App Hosting (Next.js)
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: souftoolsheb-92e1c
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: souftoolsheb-92e1c.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: souftoolsheb-92e1c.firebasestorage.app
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "278175064445"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:278175064445:web:33aa47833ab73cef9aec14"
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-X79Q2QEJM2
  - variable: TURSO_DATABASE_URL
    secret: TURSO_DATABASE_URL
    availability:
      - RUNTIME
  - variable: TURSO_AUTH_TOKEN
    secret: TURSO_AUTH_TOKEN
    availability:
      - RUNTIME
